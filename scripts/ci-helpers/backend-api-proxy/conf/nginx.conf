#
# Homepage and endpoints of the API "custom tokens".
#
worker_processes  5;
worker_rlimit_nofile 8192;

events {
  worker_connections 4096;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    error_log /dev/stdout info;
    access_log /dev/stdout;

    #access_log  /var/log/nginx/access.log  main;
    #error_log   /var/log/nginx/error.log;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Content-Location;
    proxy_set_header  Connection "";
    proxy_http_version 1.1;
    proxy_pass_request_headers      on;

    server {
        listen 0.0.0.0:80 default_server;
        server_name _;

        include "upstream_vars.conf";

        # Replace both with actual values to allow switching traffic to custom backend and easily
        # point in the UI https://prototyping.openhive.network/custom-backend/ to handle it.
        # By design at pointed target should stay another nginx performing actual routing
        # location ~ ^/custom-backend/ {
        #     proxy_pass  $custom_backend_server;
        #     break;
        # }

        # Beeyard -- Hive frontend prototype, https://prototyping.openhive.network/beeyard
        # Address comes from $beeyard_app in upstream_vars.conf (BEEYARD_APP env var,
        # defaulted by start_api_proxy.sh to a closed local port when unset).
        #
        # ^~ and not a plain prefix: it stops the regex location ~ ^/ctokens-api/ below
        # from even being considered, so /beeyard/_app/*.js can never be hijacked by a
        # regex location added here later.
        location ^~ /beeyard {
            # No URI part after the variable, exactly as in location / below: nginx then
            # forwards the request URI unchanged, prefix included. The app is a SvelteKit
            # build with paths.base=/beeyard -- it strips the prefix itself and answers 404
            # to any request arriving WITHOUT it, so a trailing slash or path here would
            # silently rewrite /beeyard/foo -> /foo and 404 the whole deploy.
            proxy_pass $beeyard_app;

            # The app reads the LAST X-Forwarded-For element as the client IP and keys a
            # 30 req/min per-IP limiter on it. Without realip, $remote_addr here is the
            # openhive proxy (10.101.101.1) on every request, the http-level
            # proxy_set_header X-Forwarded-For appends exactly that, and all visitors share
            # one bucket -- the site then 429s itself and it looks like an app fault.
            # Scoped to this location so nothing else on this server changes behaviour.
            set_real_ip_from 10.101.101.1;
            real_ip_header X-Forwarded-For;
            real_ip_recursive on;

            # Measured on the running deployment: 4445 bytes of response headers on the home
            # page, of which Link: rel=preload alone is 3851. That overflows the 4k default
            # and nginx answers 502 on HTML pages while /beeyard/api/health still returns 200.
            # Both directives are required -- with only the first, proxy_busy_buffers_size no
            # longer fits in the default proxy_buffers and nginx refuses to start.
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;

            # SSR responses are per-viewer and carry Set-Cookie: visitor_id -- never cache.
            proxy_buffering off;
            proxy_read_timeout 60s;
            client_max_body_size 2m;
        }

        location = /mcp {
            return 301 /mcp/;
        }
        location /mcp/ {
            proxy_pass http://192.168.6.21:3000;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Chat streaming endpoint — must NOT be buffered, or the SSE (token-by-token)
        # gets buffered and delivered to the browser all at once.
        location = /mcp/api/chat {
            proxy_pass http://192.168.6.21:3000;

            proxy_buffering         off;
            proxy_cache             off;
            gzip                    off;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }

        # Every ctokens-api request pass directly to the rest backend
        location ~ ^/ctokens-api/ {
            proxy_pass  $postgrest_backend;  # Assume such variable is defined earlier i.e. via nginx cmdline
            break;
        }

        # Hived should take whole traffic directly pointing root
        # since also frontend can use POST method to perform actions
        location = / {
            if ($request_method = POST) {
                proxy_pass $hive_backend;
                break;
            }
            
            # to supplement CORS headers, handled there
            if ($request_method = OPTIONS) {
                proxy_pass $hive_backend;
                break;
            }

            # All other requests pass to the application
            proxy_pass $frontend_app;
        }

        location / {
            # All other requests pass to the application
            proxy_pass $frontend_app;
        }

    }
}

